    font-size: 12px;

  }
  .metric {
    display: grid;
    gap: 6px;
    min-height: 74px;
    border: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    border-radius: 12px;
    padding: 12px;

  }

    font-weight: 700;
    color: var(--fg);
    overflow-wrap: anywhere;
  }

    display: grid;
    gap: 12px;
    padding: 16px;
  }
  .affected-panel[hidden] {

  }
  .affected-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

    gap: 8px;

  }

  }

  }
  .action-title {

    font-size: 15px;
    font-weight: 700;
  }
  .action-note {

    font-size: 13px;
    line-height: 1.4;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 42px;
    border: 1px solid color-mix(in srgb, var(--line) 50%, transparent);

    padding: 8px 16px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);

  }
