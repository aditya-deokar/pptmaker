  }
  .summary-panel {
    display: grid;
    gap: 16px;

    overflow-wrap: anywhere;
  }

    gap: 12px;
  }
  .metric {
    display: grid;
    gap: 6px;
    min-height: 74px;
    border: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    border-radius: 12px;
    padding: 12px;
    background: color-mix(in srgb, var(--surface) 60%, transparent);

  }
  .metric-value {

    font-weight: 700;
    color: var(--fg);
    overflow-wrap: anywhere;
  }

    display: grid;
    gap: 12px;
    padding: 16px;
  }
  .affected-panel[hidden] {
    display: none;
  }
  .affected-title {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
  }

  }

    font-size: 13px;
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    overflow-wrap: anywhere;
  }
  .action-panel {
    display: grid;
    align-content: start;
    gap: 12px;
    padding: 20px;
  }
  .action-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
  }
  .action-note {
    min-height: 40px;
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }
  .button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 42px;
    border: 1px solid color-mix(in srgb, var(--line) 50%, transparent);
    border-radius: 99px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    color: var(--fg);
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;

  }
  .button:hover:not(:disabled) {

  }
  .button.primary {

    background: var(--accent);
    color: var(--bg);
  }

  }
  .button:disabled,

    opacity: 0.5;
  }

  }

  }
