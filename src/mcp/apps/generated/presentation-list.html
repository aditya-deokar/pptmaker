  }
  .list-header {

    gap: 6px;

  }
  .list-kicker {

    letter-spacing: 0.05em;
  }
  .list-title {

    overflow-wrap: anywhere;
  }
  .list-summary {

    color: var(--muted);
    font-size: 15px;
    overflow-wrap: anywhere;

    flex-wrap: wrap;

    overflow-wrap: anywhere;

    color: var(--fg);

    font-size: 14px;
    font-weight: 600;

  }

  }

    padding: 24px;
    color: var(--muted);
    background: color-mix(in srgb, var(--surface) 40%, transparent);
    text-align: center;
    font-size: 14px;
  }

    }

    }
  }
