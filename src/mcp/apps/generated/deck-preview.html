    border-radius: 99px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    color: var(--fg);
    font: inherit;
    font-size: 14px;

  }

    border: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    border-radius: 12px;
    padding: 12px;
    overflow: hidden;
    background: color-mix(in srgb, var(--surface) 60%, transparent);
    transition: all 0.2s;
  }
  .slide-preview:hover {
    background: color-mix(in srgb, var(--surface) 80%, transparent);

  }
  .slide-number {
    position: absolute;
    top: 8px;
    left: 8px;
    min-width: 24px;
    border: 1px solid color-mix(in srgb, var(--line) 40%, transparent);
    border-radius: 99px;
    padding: 2px 8px;
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--fg);
    font-size: 11px;
    font-weight: 700;
    text-align: center;
  }
  .slide-title {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    margin: 0;
    color: var(--fg);
    font-size: 13px;
    font-weight: 700;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .slide-preview-text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    min-height: 36px;
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .empty-state {
    border: 1px dashed color-mix(in srgb, var(--line) 60%, transparent);
    border-radius: 12px;
    padding: 24px;
    color: var(--muted);
    background: color-mix(in srgb, var(--surface) 40%, transparent);
    text-align: center;
    font-size: 14px;
  }
  .is-loading .cover-preview,

  .is-loading .button,
  .is-loading .slide-preview {
    opacity: 0.6;
    pointer-events: none;
  }

    }
    .cover-title {

    }
    .cover-text { max-width: 100%; }
    .action-panel { grid-template-columns: 1fr; }
    .filmstrip-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
